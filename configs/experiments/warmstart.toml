dataset_config = "configs/datasets/licl.toml"
method = "pd"
output_dir = "results/licl/warmstart"

[initialization]
mode = "warmstart"

[warmstart]
# Each initial model is generated by static L-BFGS and then passed to PD.
labels = ["energy_dominated", "balanced", "force_dominated"]
alphas = "REQUIRED"
max_iter = "REQUIRED"
f_reltol = "REQUIRED"
gamma = "REQUIRED"
