# Dataset defaults. Set REQUIRED fields in the experiment configuration.
seed = 1234
output_dir = "results/licl"

[dataset]
name = "LiCl"
train_file = "data/LiCl/LiCl_train.xyz"
test_file = "data/LiCl/LiCl_test.xyz"
expected_train = 586
expected_test = 52

[dataset.train_opts]
energy_key = "energy"
force_key = "forces"

[dataset.test_opts]
energy_key = "energy"
force_key = "forces"

[units]
confirmed = true
energy = "eV"
force = "eV/angstrom"
length = "angstrom"
source_note = "Input energies, forces, and positions use the declared units; no numerical conversion is applied."

[model]
elements = ["Li", "Cl"]
order = 3
totaldegree = 10
rcut = 5.5

[initialization]
mode = "zeros"

[runtime]
blas_threads = 1

[pd]
primal_lr = 1e-4
dual_lr = 1e-2
initial_learning_rate = 1e-4
max_iter = 50000
epsilon_F = 1e-5
lambda_F_0 = 0.0
lambda_F_max = 1e4
dual_update_freq = 50
# Set a positive interval and a factor below 1 to enable decay.
lr_decay_step = 0
lr_decay_factor = 1.0
# Energy observations; one per configuration.
batch_size_E = 117
# Force scalar components, sampled independently. Use "all" for full data.
# round(batch_size_E * training_force_components / training_energy_observations)
# round(117 * 114702 / 586)
batch_size_F = 22901
eval_every = 50
warmup_steps = 1000
verbose = true
tol = 1e-6
patience = 50

[refine]
enabled = true
max_iter = 2000
gamma = 1e-8
g_tol = 1e-4
f_reltol = 0.0
eval_every = 10
print_every = 50
verbose = true

[static]
alpha = "REQUIRED"
gamma = 1e-8
max_iter = 25000
f_reltol = 1e-6
g_tol = 1e-4
eval_every = 10
print_every = 50
verbose = true

[lsqr]
damp = 1e-2
atol = 1e-6
smoothness = 4
conlim = 1e8
maxiter = 100000
verbose = false
weight_E = "REQUIRED"
weight_F = "REQUIRED"

[scan]
n = 9
alpha_min = 0.001
alpha_max = 0.999
weight_reference_E = 30.0
weight_reference_F = 1.0
knee_alphas = "REQUIRED"

[heuristic]
alpha = "REQUIRED"
source_note = "Set alpha to the baseline energy fraction in the normalized static objective."
