# Dataset defaults. Set REQUIRED fields in the experiment configuration.
seed = 1234
output_dir = "results/si"

[dataset]
name = "Si"
train_file = "data/OOD-Si/Si_train.xyz"
test_file = "data/OOD-Si/Si_test_filtered.xyz"
expected_train = 2475
expected_test = 21

[dataset.train_opts]
energy_key = "dft_energy"
force_key = "dft_force"

[dataset.test_opts]
energy_key = "energy"
force_key = "dft_force"

[units]
confirmed = true
energy = "eV"
force = "eV/angstrom"
length = "angstrom"
source_note = "Input energies, forces, and positions use the declared units; no numerical conversion is applied."

[model]
elements = ["Si"]
order = 4
totaldegree = 20
rcut = 6.0

[model.Eref]
Si = -158.54496821

[initialization]
mode = "zeros"

[runtime]
blas_threads = 1

[pd]
primal_lr = 1e-6
dual_lr = 0.3
initial_learning_rate = 1e-6
max_iter = 20000
epsilon_F = 1e-5
lambda_F_0 = 0.0
lambda_F_max = 1e4
dual_update_freq = 50
# Set a positive interval and a factor below 1 to enable decay.
lr_decay_step = 0
lr_decay_factor = 1.0
# Energy observations; one per configuration.
batch_size_E = 618
# Force scalar components, sampled independently. Use "all" for full data.
# round(batch_size_E * training_force_components / training_energy_observations)
# round(618 * 515445 / 2475)
batch_size_F = 128705
eval_every = 50
warmup_steps = 1000
verbose = true
tol = 1e-6
patience = 50

[refine]
enabled = true
max_iter = 2000
gamma = 1e-8
g_tol = 1e-4
f_reltol = 0.0
eval_every = 10
print_every = 50
verbose = true

[static]
alpha = "REQUIRED"
gamma = 1e-8
max_iter = 10000
f_reltol = 1e-6
g_tol = 1e-4
eval_every = 10
print_every = 50
verbose = true

[lsqr]
damp = 1e-2
atol = 1e-6
smoothness = 4
conlim = 1e8
maxiter = 100000
verbose = false
weight_E = "REQUIRED"
weight_F = "REQUIRED"

[scan]
n = 9
alpha_min = 0.001
alpha_max = 0.999
weight_reference_E = 30.0
weight_reference_F = 1.0
knee_alphas = "REQUIRED"

[heuristic]
alpha = "REQUIRED"
source_note = "Set alpha to the baseline energy fraction in the normalized static objective."
